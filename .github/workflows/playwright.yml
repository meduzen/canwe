# https://playwright.dev/docs/ci-intro
name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PW_BASE_URL: http://localhost:4173

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v6

      # https://github.com/actions/setup-node
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Purge unneeded devDependencies
        run: ./scripts/prepare-playwright.sh || true
      - name: Install dependencies
        run: npm ci --audit=false --fund=false
      - run: touch .env && echo "PW_BASE_URL='http://localhost:4173'" >> .env
      - name: Build website
        run: PW_BASE_URL=${{ env.PW_BASE_URL }} npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: PW_BASE_URL=${{ env.PW_BASE_URL }} npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
